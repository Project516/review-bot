name: Test

on:
  pull_request:
  push:
    branches: [master]
  # The weekly refresh opens its PR with GITHUB_TOKEN, which does not
  # raise a pull_request run, so the refresh dispatches this workflow on the
  # branch it pushed. Without this trigger that dispatch is rejected and the
  # branch reaches master with nothing run against it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test
