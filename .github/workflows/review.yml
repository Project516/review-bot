name: Review
# The repo under review is never named here: this repo is public and its run
# titles are world readable. ref is the Worker's anonymous handle for the repo.
run-name: Review ${{ github.event.client_payload.ref }}#${{ github.event.client_payload.pr }} (${{ github.event.client_payload.action }})

on:
  repository_dispatch:
    types: [review-request]

concurrency:
  group: review-${{ github.event.client_payload.ref }}-${{ github.event.client_payload.pr }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node src/review.js
        env:
          EVENT_JSON: ${{ toJSON(github.event.client_payload) }}
          REVIEWBOT_POLICY: ${{ secrets.REVIEWBOT_POLICY }}
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
