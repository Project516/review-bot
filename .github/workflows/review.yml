name: Review
# The repo under review is never named here: this repo is public and its run
# titles are world readable. ref is the Worker's anonymous handle for the repo.
run-name: Review ${{ github.event.client_payload.ref }}#${{ github.event.client_payload.pr }} (${{ github.event.client_payload.action }})

on:
  repository_dispatch:
    types: [review-request]

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.client_payload.ref }}-${{ github.event.client_payload.pr }}-${{ github.event.client_payload.thread || 'review' }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # A run spends real time waiting: the rotation is a pass over the pins, the
    # runners-up and the router plus a reserve, and a measured call on a busy free
    # model ran past a minute. 30 leaves the calls room inside the budget the
    # retry logic asks for, so the reserve is spent on calls rather than lost to
    # the runner killing the job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The job is read from the event file, not passed in env: Actions prints a
      # step's env in the log, and the payload names the repo and author.
      - run: node src/review.js
        env:
          REVIEWBOT_POLICY: ${{ secrets.REVIEWBOT_POLICY }}
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
