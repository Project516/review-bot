name: Refresh model pins

# Free models come and go. This ranks what is on the free list today against
# the pins in reviewbot.json and opens a PR with the new order, set to
# auto-merge once the tests pass. It never pushes to master.
on:
  schedule:
    # Mondays, early, when the week's models have settled.
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: refresh-model-pins
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  # A PR opened with GITHUB_TOKEN does not trigger other workflows, so the
  # push_request and pull_request runs this PR would normally get never happen
  # and it would reach master ungated. workflow_dispatch is the one trigger that
  # does fire with this token, so the job asks for the test run itself.
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # This job branches off origin/master and pushes from there, so it needs
          # the history rather than the one commit checkout fetches by default.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run the tests
        run: node --test
      - name: Rank the free models
        id: pins
        run: node src/refresh-models.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The ref comes from the job rather than being written here, because a week
      # with no change pushes no branch at all: a name typed in twice is the same
      # name whether the job wrote it this week or left it alone last week, and
      # dispatching then tests a stale commit or 404s on a ref that is not there.
      # always() still holds, so a push that is followed by a failed PR open is
      # tested rather than quietly left ungated.
      - name: Run the tests on the branch this PR carries
        if: always() && steps.pins.outputs.ref != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.pins.outputs.ref }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/dispatches" -f ref="$REF"
          echo "tests dispatched on $REF"
