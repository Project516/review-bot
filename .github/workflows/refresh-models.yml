name: Refresh model pins

# Free models come and go. This ranks what is on the free list today against
# the pins in reviewbot.json and opens a PR with the new order, set to
# auto-merge once the tests pass. It never pushes to master.
on:
  schedule:
    # Mondays, early, when the week's models have settled.
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: refresh-model-pins
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A PR opened with GITHUB_TOKEN holds its pull_request runs for approval,
      # so the required test never starts and auto-merge waits forever. The
      # App's token opens it like any other author.
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
          # This job branches off origin/master and pushes from there, so it needs
          # the history rather than the one commit checkout fetches by default.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Run the tests
        run: node --test
      - name: Rank the free models
        run: node src/refresh-models.js
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
